<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小姜智能AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #4158D0, #C850C0);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .box{
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        h1{
            text-align: center;
            color: #4158D0;
            margin-bottom: 24px;
        }
        textarea{
            width: 100%;
            height: 130px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            resize: none;
        }
        button{
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            background: #4158D0;
            color: white;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover{
            opacity: 0.9;
        }
        .result{
            margin-top: 22px;
            padding: 16px;
            background: #f6f7ff;
            border-radius: 12px;
            min-height: 90px;
            color: #333;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✨小姜智能AI</h1>
        <textarea id="inputText" placeholder="在这里输入你想问的任何问题，小姜智能AI会实时回答"></textarea>
        <button onclick="aiMake()">小姜智能生成</button>
        <div class="result" id="res">生成结果会显示在这里</div>
    </div>

<script>
const API_KEY = "8c10b2c7d13843ac8f61536322ad491e.cenE8EzI0XthEXNU";
async function aiMake(){
    let userText = document.getElementById("inputText").value;
    if(!userText.trim()){
        document.getElementById("res").innerText = "请先输入你的问题！";
        return;
    }
    document.getElementById("res").innerText = "小姜AI思考中……";
    try{
        const res = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${API_KEY}`
            },
            body:JSON.stringify({
                model:"glm-4-flash",
                messages:[{"role":"user","content":userText}]
            })
        })
        const data = await res.json();
        if (data.error) {
            document.getElementById("res").innerText = `接口错误：${data.error.message}`;
        } else {
            document.getElementById("res").innerText = data.choices[0].message.content;
        }
    }catch(err){
        document.getElementById("res").innerText = `跨域拦截，调用失败`;
    }
}
</script>
</body>
</html>
