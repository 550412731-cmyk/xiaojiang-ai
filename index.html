<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有些话想告诉你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #7b4397, #dc2430);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .box{
            width: 90%;
            max-width: 450px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px #00000033;
        }
        h1{
            color: #c84b8c;
            margin-bottom: 25px;
            font-size: 24px;
        }
        button{
            border: none;
            background-color: #5168e9;
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover{
            background-color: #3f52c9;
        }
        .tip{
            margin-top:24px;
            font-size:17px;
            color:#444;
            min-height:26px;
        }
        .heart{
            position:fixed;
            color:#ff4777;
            font-size:28px;
            animation: fall 4s linear forwards;
            pointer-events:none;
        }
        @keyframes fall{
            0%{transform: translateY(-20px);opacity:1;}
            100%{transform: translateY(100vh);opacity:0;}
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✨有些话想告诉你</h1>
        <button onclick="showLove()">点这里</button>
        <div class="tip" id="msg"></div>
    </div>

    <script>
        const words = [
            "遇见你，是很幸运的一件事",
            "我一直都很喜欢你",
            "希望往后的日子，有你相伴",
            "小宝宝雷馥榕，我是姜锐呐",
            "谢谢你为我弄的围巾，你像一束光照进我的生活里",
            "小宝宝我爱你"
        ];
        function showLove(){
            let text = words[Math.floor(Math.random() * words.length)];
            document.getElementById("msg").innerText = text;
            for(let i = 0; i < 12; i++){
                setTimeout(()=>{
                    let h = document.createElement('div');
                    h.className = "heart";
                    h.innerText = "♥";
                    h.style.left = Math.random() * 100 + "vw";
                    document.body.appendChild(h);
                    setTimeout(()=> h.remove(), 4000);
                }, i * 80)
            }
        }
    </script>
</body>
</html>
